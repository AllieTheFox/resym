[package]
name = "resym_core"
version.workspace = true
edition = "2021"
rust-version = "1.75"
exclude = [
    "tests/data/*",
    "tests/snapshots/*",
]

[features]
default = ["rayon", "http"]

rayon = ["dep:rayon", "dep:num_cpus", "dashmap/rayon"]
http = ["dep:ehttp", "dep:url"]

[dependencies]
# ergrelet/pdb 0.8.0-resym01 with the `is_mocom` fix
pdb = { git = "https://github.com/AllieTheFox/pdb", rev = "1d1d42d7e0739020eb32eaa9a66762e121590dc0" }
thiserror = "1.0"
log = "0.4"
rayon = { version = "1.10", optional = true }
num_cpus = { version = "1.13", optional = true }
crossbeam-channel = "0.5"
dashmap = { version = "5.5" }
regex = "1.10"
similar = "2.4"
ehttp = { version = "0.5", optional = true }
url = { version = "2.5", optional = true }
msvc-demangler = "0.10"
bevy_reflect = "0.15"

# Web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm_thread = { version = "0.3", features = ["es_modules"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[dev-dependencies]
insta = "1.14"
